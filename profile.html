    <header class="header">

    <main class="profile">
      <section class="profile__header">

        </svg>
        <h2 class="profile__name">Rukiye Devran</h2>
      </section>

      <section class="profile__about">
        <h3>About me</h3>
        <p>Passionate web development student learning HTML, CSS, and building cool mobile web applications step by step!</p>
      </section>

      <section class="profile__counters">
        <div class="counter-box">
          <!-- question icon -->
          <svg class="counter-box__svg counter-box__svg--question" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px">
            <path d="M424-320q0-81 14.5-116.5T500-514q41-36 62.5-62.5T584-637q0-41-27.5-68T480-732q-51 0-77.5 31T365-638l-103-44q21-64 77-111t141-47q105 0 161.5 58.5T698-641q0 50-21.5 85.5T609-475q-49 47-59.5 71.5T539-320H424Zm56 240q-33 0-56.5-23.5T400-160q0-33 23.5-56.5T480-240q33 0 56.5 23.5T560-160q0 33-23.5 56.5T480-80Z"/>
          </svg>
          <span class="counter-box__number">12</span>
          <span class="counter-box__label">Questions</span>
        </div>
        <div class="counter-box">
          <!-- bookmark icon -->
          <svg class="counter-box__svg counter-box__svg--bookmark" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px">
            <path d="M200-120v-640q0-33 23.5-56.5T280-840h400q33 0 56.5 23.5T760-760v640L480-240 200-120Z"/>
          </svg>
          <span class="counter-box__number">2</span>
          <span class="counter-box__label">Bookmarks</span>
        </div>
      </section>

      <section class="profile__section">
        <h2 class="profile__heading">Settings</h2>
        <div class="setting-item">
          <span>Dark Mode</span>
          <label class="switch">
            <input type="checkbox">
            <span class="slider"></span>
          </label>
        </div>
      </section> 
    </main>
