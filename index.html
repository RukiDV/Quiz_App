<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="css/main.css">
  </head>
  <body>
    <header class="header">
      <h1 class="header__title">Quiz App</h1>
    </header>  

    <main class="home">
      <!-- card 1 -->
      <article class="card">
        <button class="card__bookmark-button" aria-label="Bookmark">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="card__bookmark-icon">
            <path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/>
          </svg>
        </button>
        <h2 class="card__question">What is the CSS property used to change the text color?</h2>
        <button class="card__button-answer">Show answer</button>
        <p class="card__answer hidden">color</p>
        <ul class="card__tag-list">
          <li class="card__tag">#html</li>
          <li class="card__tag">#css</li>
        </ul>
      </article>

      <!-- card 2 -->
      <article class="card">
       <button class="card__bookmark-button" aria-label="Bookmark">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="card__bookmark-icon">
            <path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/>
          </svg>
        </button> 
        <h2 class="card__question">Which HTML tag is used to define an unordered list?</h2>
        <button class="card__button-answer">Show answer</button>
        <p class="card__answer hidden">&lt;ul&gt;</p>
        <ul class="card__tag-list">
          <li class="card__tag">#html</li>
          <li class="card__tag">#code</li>
        </ul>
      </article>

      <!-- card 3 -->
      <article class="card">
        <button class="card__bookmark-button" aria-label="Bookmark">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="card__bookmark-icon">
            <path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/>
          </svg>
        </button>
        <h2 class="card__question">How do you make text bold in HTML using a semantic tag?</h2>
        <button class="card__button-answer">Show answer</button>
        <p class="card__answer hidden">&lt;strong&gt;</p>
        <ul class="card__tag-list">
          <li class="card__tag">#html</li>
          <li class="card__tag">#semantics</li>
        </ul>
      </article>
    </main>
