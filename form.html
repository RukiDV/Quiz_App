<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App - Add Question</title>
    <link rel="stylesheet" href="css/main.css">
  </head>
  <body>
    <header class="header">
      <h1 class="header__title">Quiz App</h1>
    </header>

    <main class="form-container">
      <h2>Add a new question</h2>
      
      <form class="form">
        <!-- question -->
        <div class="form__field">
          <label for="question" class="form__label">Your question</label>
          <textarea id="question" name="question" rows="4" required></textarea>
        </div>

        <!-- answer -->
        <div class="form__field">
          <label for="answer" class="form__label">Your answer</label>
          <textarea id="answer" name="answer" rows="4" required></textarea>
        </div>

        <!-- tag -->
        <div class="form__field">
          <label for="tag" class="form__label">Add Tag</label>
          <input type="text" id="tag" name="tag" required>
        </div>

        <!-- submit button -->
        <button type="submit" class="form__button">Submit</button>
      </form>
    </main>

    <!-- Navigation Footer -->
    <nav class="navigation">
      <!-- home link -->
      <a class="navigation__link" href="index.html" aria-label="Home">

        </svg>
      </a>

      <!-- bookmarks link -->

          <path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/>
        </svg>

      <!-- form link -->
     <a class="navigation__link navigation__link--active" href="form.html" aria-label="Add Question">

  </body>
